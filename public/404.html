<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404</title>
  <meta http-equiv="refresh" content="0; url=./" />
  <script>
    // SPA 深链接兜底：GitHub Pages 对前端路由的 404 重定向回首页
    sessionStorage.setItem('redirect', location.pathname);
    location.replace('./');
  </script>
</head>
<body></body>
</html>
